<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Azat</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #f6f5f1);
    --fg: var(--tg-theme-text-color, #14171f);
    --muted: var(--tg-theme-hint-color, #6b7080);
    --line: color-mix(in srgb, var(--fg) 14%, transparent);
    --accent: var(--tg-theme-button-color, #2f5bff);
    --accent-fg: var(--tg-theme-button-text-color, #fff);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: var(--bg); color: var(--fg); }
  body {
    font-family: "Manrope", system-ui, sans-serif; line-height: 1.5;
    padding: env(safe-area-inset-top, 0) 20px calc(env(safe-area-inset-bottom, 0px) + 32px);
    max-width: 560px; margin: 0 auto;
  }
  h1, h2 { font-family: "Unbounded", "Manrope", sans-serif; }
  .bar { display: flex; justify-content: space-between; align-items: center; min-height: 44px; margin-top: 10px; }
  .topback { padding: 8px 4px; border: 0; background: none; color: var(--accent); font: 700 16px "Manrope", sans-serif; cursor: pointer; }
  .topback[hidden] { display: none; }
  .langs { display: flex; gap: 4px; margin-left: auto; }
  .langs button {
    border: 1px solid var(--line); background: none; color: var(--muted); border-radius: 999px;
    padding: 5px 11px; font: 700 12px "Manrope", sans-serif; cursor: pointer;
  }
  .langs button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  button:focus-visible, .row:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  header { padding: 18px 0 10px; }
  h1 { font-size: 38px; font-weight: 800; line-height: 1.05; letter-spacing: -0.02em; }
  h2 { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
  .lead { margin-top: 10px; color: var(--muted); font-weight: 700; }
  .text { margin: 8px 0 4px; white-space: pre-line; }
  .note { margin: 6px 0; color: var(--muted); }
  .grp { margin: 18px 0 0; font: 800 12px "Manrope", sans-serif; letter-spacing: .08em; color: var(--muted); }
  .row {
    display: flex; gap: 14px; align-items: center; width: 100%;
    padding: 16px 0; border: 0; border-bottom: 1px solid var(--line);
    background: none; color: inherit; text-align: left; font: inherit; cursor: pointer;
  }
  .row .lbl { flex: 1; }
  .row b { font-weight: 700; display: block; }
  .row small { display: block; color: var(--muted); font-size: 13px; }
  .mono b { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 17px; letter-spacing: .02em; }
  .ico { font-size: 22px; flex: none; width: 30px; text-align: center; }
  .go { color: var(--muted); flex: none; }
  #view { padding-top: 10px; }
  #toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 28px); transform: translateX(-50%);
    background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-weight: 700; font-size: 14px;
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  #toast.on { opacity: 1; }
  @media (prefers-reduced-motion: no-preference) {
    h1 { animation: rise .6s ease-out both; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
  }
</style>
</head>
<body>
<div class="bar">
  <button id="backBtn" class="topback" hidden></button>
  <div class="langs" id="langs">
    <button data-l="ru">RU</button><button data-l="en">EN</button><button data-l="uz">UZ</button>
  </div>
</div>
<header>
  <h1>Azat</h1>
  <p class="lead">@azatrdv</p>
</header>
<main id="view"></main>
<div id="toast" role="status"></div>

<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

// ---- Настройки: впишите свои значения ----
const APK_URL = "https://github.com/azatbekturdiyev-alt/a.turdiyev/archive/refs/tags/v1.0.0.tar.gz"; // APK из GitHub Releases
const ANON_LINK = "https://t.me/anonaskbot?start=user_chodhyhmxt"; // ваша ссылка из анонимного бота (пусто — раздел покажет «скоро»)

const IG = (u) => "https://www.instagram.com/" + u;

// ---- Тексты ----
const L = {
  ru: {
    services: "Услуги", projects: "Проекты", contact: "Связаться", cards: "Карты", channels: "ТГК", anon: "Анонимное сообщение",
    back: "Назад", note_services: "Раздел в разработке — напишите мне, всё решим лично.",
    order: "Здравствуйте! Интересует: ",
    srv: { site: "Создать сайт", stars: "Купить Telegram Stars", nft: "Купить NFT Gift", premium: "Купить Telegram Premium" },
    about_btn: (n) => `Что такое ${n}?`, site: "Сайт", download: "Скачать", bot: "Телеграм бот", channel: "Телеграм канал", tg: "Телеграм", insta: "Инстаграм", play: "Играть",
    about: {
      sosed: "sosed.uz — шеринг вещей и взаимопомощь рядом с вами!\n\nУдобный сервис в Telegram и на сайте, который объединяет соседей по районам. Делитесь тем, чем не пользуетесь, берите во временное пользование нужные инструменты (бесплатно или за символическую плату) и выручайте друг друга в пару кликов.",
      auction: "auction game — это Telegram-игра «Аукцион», азартная дуэль с друзьями, где вы торгуетесь за случайные лоты, соревнуясь в стратегической выдержке и распределении бюджета!\n\nСобирайте сильнейшие команды по супергероям Marvel/DC или известным футболистам вслепую и узнайте, чей состав окажется мощнее.",
      kylix: "kylix.uz — это интернет-магазин с большим выбором товаров: одежда, обувь, кепки и многое другое с удобной доставкой.",
    },
    phone: "Телефон", cards_hint: "Нажмите на номер, чтобы скопировать.", copied: "Скопировано",
    channel_n: (n) => `Канал ${n}`,
    anon_text: "Нажмите кнопку — откроется официальный анонимный бот, и вы сможете написать мне, не раскрывая себя.",
    anon_soon: "Раздел скоро будет доступен.", anon_go: "Написать анонимно",
  },
  en: {
    services: "Services", projects: "Projects", contact: "Contact", cards: "Cards", channels: "TG channels", anon: "Anonymous message",
    back: "Back", note_services: "This section is under development. Message me and we'll sort it out personally.",
    order: "Hello! I'm interested in: ",
    srv: { site: "Create a website", stars: "Buy Telegram Stars", nft: "Buy NFT Gift", premium: "Buy Telegram Premium" },
    about_btn: (n) => `What is ${n}?`, site: "Website", download: "Download", bot: "Telegram bot", channel: "Telegram channel", tg: "Telegram", insta: "Instagram", play: "Play",
    about: {
      sosed: "sosed.uz — item sharing and mutual help right next to you!\n\nA convenient service in Telegram and on the web that connects neighbors by district. Share what you don't use, borrow the tools you need (free or for a small fee) and help each other out in a couple of taps.",
      auction: "auction game is the Telegram game “Auction” — a thrilling duel with friends where you bid on random lots, testing your strategic nerve and budget management!\n\nBlindly build the strongest teams of Marvel/DC superheroes or famous footballers and find out whose lineup turns out more powerful.",
      kylix: "kylix.uz is an online store with a wide choice of goods: clothes, shoes, caps and much more with convenient delivery.",
    },
    phone: "Phone", cards_hint: "Tap a number to copy it.", copied: "Copied",
    channel_n: (n) => `Channel ${n}`,
    anon_text: "Tap the button — the official anonymous bot will open and you can write to me without revealing yourself.",
    anon_soon: "This section will be available soon.", anon_go: "Write anonymously",
  },
  uz: {
    services: "Xizmatlar", projects: "Loyihalar", contact: "Bog‘lanish", cards: "Kartalar", channels: "TG kanallar", anon: "Anonim xabar",
    back: "Orqaga", note_services: "Bo‘lim ishlab chiqilmoqda. Menga yozing — hammasini shaxsan hal qilamiz.",
    order: "Assalomu alaykum! Qiziqtirdi: ",
    srv: { site: "Sayt yaratish", stars: "Telegram Stars sotib olish", nft: "NFT Gift sotib olish", premium: "Telegram Premium sotib olish" },
    about_btn: (n) => `${n} nima?`, site: "Sayt", download: "Yuklab olish", bot: "Telegram bot", channel: "Telegram kanal", tg: "Telegram", insta: "Instagram", play: "O‘ynash",
    about: {
      sosed: "sosed.uz — buyumlarni ulashish va o‘zaro yordam, aynan yoningizda!\n\nTelegram va saytdagi qulay xizmat, u qo‘shnilarni mahallalar bo‘yicha birlashtiradi. Foydalanmaydigan narsalaringizni ulashing, kerakli asboblarni vaqtincha oling (bepul yoki ramziy haq evaziga) va bir necha bosishda bir-biringizga yordam bering.",
      auction: "auction game — bu Telegram’dagi «Auksion» o‘yini, do‘stlar bilan shov-shuvli bellashuv: tasodifiy lotlar uchun savdolashasiz, strategik sabr va byudjetni taqsimlashda bellashasiz!\n\nMarvel/DC superqahramonlari yoki mashhur futbolchilardan eng kuchli jamoalarni ko‘r-ko‘rona yig‘ing va kimning tarkibi kuchliroq ekanini bilib oling.",
      kylix: "kylix.uz — keng tanlovli internet-do‘kon: kiyim, poyabzal, kepkalar va boshqa ko‘p narsalar qulay yetkazib berish bilan.",
    },
    phone: "Telefon", cards_hint: "Nusxalash uchun raqamni bosing.", copied: "Nusxalandi",
    channel_n: (n) => `${n}-kanal`,
    anon_text: "Tugmani bosing — rasmiy anonim bot ochiladi va siz o‘zingizni oshkor qilmasdan menga yoza olasiz.",
    anon_soon: "Bo‘lim tez orada ishga tushadi.", anon_go: "Anonim yozish",
  },
};

// ---- Язык ----
let lang = "ru";
try { lang = localStorage.getItem("lang") || ""; } catch (_) {}
if (!L[lang]) {
  const code = ((tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code) || navigator.language || "ru").toLowerCase();
  lang = code.startsWith("uz") ? "uz" : code.startsWith("en") ? "en" : "ru";
}

// ---- Экраны ----
// item: {t: go|tg|ext|order|copy|label, l: подпись, v: значение, s: подпись под ней, i: иконка (только в главном меню)}
function views() {
  const x = L[lang];
  const proj = (k, name, items) => ({ title: name, back: "projects", items: [{ t: "go", l: x.about_btn(name), v: "about_" + k }, ...items] });
  return {
    home: { items: [
      { t: "go", l: x.services, v: "services", i: "◾" },
      { t: "go", l: x.projects, v: "projects", i: "👾" },
      { t: "go", l: x.contact, v: "contact", i: "📞" },
      { t: "go", l: x.cards, v: "cards", i: "💳" },
      { t: "go", l: x.channels, v: "channels", i: "📢" },
      { t: "go", l: x.anon, v: "anon", i: "✉️" },
    ]},
    services: { title: x.services, back: "home", note: x.note_services,
      items: ["site", "stars", "nft", "premium"].map(k => ({ t: "order", l: x.srv[k], v: x.srv[k] })) },
    projects: { title: x.projects, back: "home", items: [
      { t: "go", l: "sosed.uz", v: "sosed" }, { t: "go", l: "auction game", v: "auction" }, { t: "go", l: "kylix.uz", v: "kylix" },
    ]},
    sosed: proj("sosed", "sosed.uz", [
      { t: "ext", l: x.site, v: "https://aztrdv.adaf.workers.dev/" },
      { t: "ext", l: x.download, v: APK_URL },
      { t: "tg", l: x.bot, v: "localtasks_bot" },
      { t: "tg", l: x.channel, v: "sosed_uzz" },
      { t: "ext", l: x.insta, v: IG("sosed_uz") },
    ]),
    auction: proj("auction", "auction game", [
      { t: "tg", l: x.play, v: "auction_hub_bot" },
      { t: "tg", l: x.tg, v: "auctiongame_az" },
      { t: "ext", l: x.insta, v: IG("auction_game") },
    ]),
    kylix: proj("kylix", "kylix.uz", [
      { t: "tg", l: x.tg, v: "kylixuz" },
      { t: "ext", l: x.insta, v: IG("kylix.uz") },
    ]),
    about_sosed: { title: "sosed.uz", back: "sosed", text: x.about.sosed },
    about_auction: { title: "auction game", back: "auction", text: x.about.auction },
    about_kylix: { title: "kylix.uz", back: "kylix", text: x.about.kylix },
    contact: { title: x.contact, back: "home", items: [
      { t: "ext", l: "+998 877701799", v: "tel:+998877701799", s: x.phone },
      { t: "tg", l: "@azatrdv", v: "azatrdv", s: "Telegram" },
      { t: "tg", l: "@nsvef", v: "nsvef", s: "Telegram" },
      { t: "ext", l: "azat.trd", v: IG("azat.trd"), s: "Instagram" },
    ]},
    cards: { title: x.cards, back: "home", note: x.cards_hint, items: [
      { t: "label", l: "HUMO" },
      { t: "copy", l: "9860 1901 0257 9728", s: "AZATBEK TURDIYEV" },
      { t: "copy", l: "4067 0700 0641 3905", s: "AZATBEK TURDIYEV" },
      { t: "label", l: "VISA" },
      { t: "copy", l: "4466 1369 5252 6631", s: "AZATBEK TURDIYEV" },
    ]},
    channels: { title: x.channels, back: "home", items: [
      { t: "tg", l: x.channel_n(1), v: "scznd" },
      { t: "tg", l: x.channel_n(2), v: "+KUqAVx6C9eYyMTFi" },
    ]},
    anon: ANON_LINK
      ? { title: x.anon, back: "home", text: x.anon_text, items: [{ t: "ext", l: x.anon_go, v: ANON_LINK }] }
      : { title: x.anon, back: "home", text: x.anon_soon },
  };
}

// ---- Отрисовка ----
const el = document.getElementById("view");
const backBtn = document.getElementById("backBtn");
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let current = "home";

function render(name) {
  const v = views()[name];
  let h = v.title ? `<h2>${esc(v.title)}</h2>` : "";
  if (v.text) h += `<p class="text">${esc(v.text)}</p>`;
  if (v.note) h += `<p class="note">${esc(v.note)}</p>`;
  (v.items || []).forEach((it) => {
    if (it.t === "label") { h += `<p class="grp">${esc(it.l)}</p>`; return; }
    const ico = it.i ? `<span class="ico">${it.i}</span>` : "";
    const sub = it.s ? `<small>${esc(it.s)}</small>` : "";
    const arrow = it.t === "go" ? "›" : "";
    h += `<button class="row${it.t === "copy" ? " mono" : ""}" data-t="${it.t}" data-v="${esc(it.v ?? it.l)}">${ico}<span class="lbl"><b>${esc(it.l)}</b>${sub}</span><span class="go">${arrow}</span></button>`;
  });
  el.innerHTML = h;
  window.scrollTo(0, 0);
  current = name;
  backBtn.hidden = !v.back;
  backBtn.textContent = "‹ " + L[lang].back;
  if (tg) { v.back ? tg.BackButton.show() : tg.BackButton.hide(); }
  document.querySelectorAll("#langs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.l === lang));
  document.documentElement.lang = lang;
}

function back() { const b = views()[current].back; if (b) render(b); }

const openTg = (u) => (tg && tg.openTelegramLink) ? tg.openTelegramLink("https://t.me/" + u) : window.open("https://t.me/" + u, "_blank");
const openExt = (u) => (tg && tg.openLink) ? tg.openLink(u) : window.open(u, "_blank");

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("on");
  setTimeout(() => t.classList.remove("on"), 1400);
}

async function copyText(s) {
  try { await navigator.clipboard.writeText(s); }
  catch (_) {
    const a = document.createElement("textarea");
    a.value = s; document.body.appendChild(a); a.select();
    try { document.execCommand("copy"); } catch (_) {}
    a.remove();
  }
  if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
  toast(L[lang].copied);
}

el.addEventListener("click", (e) => {
  const b = e.target.closest(".row"); if (!b) return;
  const { t, v } = b.dataset;
  if (t === "go") render(v);
  else if (t === "tg") openTg(v);
  else if (t === "ext") openExt(v);
  else if (t === "copy") copyText(v);
  else if (t === "order") openTg("azatrdv?text=" + encodeURIComponent(L[lang].order + v));
});

document.getElementById("langs").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  lang = b.dataset.l;
  try { localStorage.setItem("lang", lang); } catch (_) {}
  render(current);
});

backBtn.addEventListener("click", back);
if (tg) tg.BackButton.onClick(back);
render("home");
</script>
</body>
</html>
