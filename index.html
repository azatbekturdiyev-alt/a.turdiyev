<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Azat</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #f6f5f1);
    --fg: var(--tg-theme-text-color, #14171f);
    --muted: var(--tg-theme-hint-color, #6b7080);
    --line: color-mix(in srgb, var(--fg) 14%, transparent);
    --accent: var(--tg-theme-button-color, #2f5bff);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: var(--bg); color: var(--fg); }
  body {
    font-family: "Manrope", system-ui, sans-serif; line-height: 1.5;
    padding: env(safe-area-inset-top, 0) 20px calc(env(safe-area-inset-bottom, 0px) + 32px);
    max-width: 560px; margin: 0 auto;
  }
  h1, h2 { font-family: "Unbounded", "Manrope", sans-serif; }
  .topback { display: block; margin: 14px 0 -22px; padding: 8px 4px; border: 0; background: none; color: var(--accent); font: 700 16px "Manrope", sans-serif; cursor: pointer; }
  .topback[hidden] { display: none; }
  .topback:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  header { padding: 36px 0 12px; }
  h1 { font-size: 38px; font-weight: 800; line-height: 1.05; letter-spacing: -0.02em; }
  h2 { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
  .lead { margin-top: 12px; color: var(--muted); }
  .text { margin: 8px 0 4px; white-space: pre-line; }
  .row {
    display: flex; gap: 14px; align-items: center; width: 100%;
    padding: 16px 0; border: 0; border-bottom: 1px solid var(--line);
    background: none; color: inherit; text-align: left; font: inherit; cursor: pointer; text-decoration: none;
  }
  .row:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .row b { font-weight: 700; flex: 1; }
  .ico { font-size: 24px; flex: none; width: 30px; text-align: center; }
  .go { color: var(--muted); flex: none; }
  .back { color: var(--accent); }
  #view { padding-top: 14px; }
  @media (prefers-reduced-motion: no-preference) {
    h1 { animation: rise .6s ease-out both; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
  }
</style>
</head>
<body>
<button id="backBtn" class="topback" hidden>‹ Назад</button>
<header>
  <h1>Azat</h1>
  <p class="lead">Привет! Это Azat (@azatrdv) 👋</p>
</header>
<main id="view"></main>

<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

// Прямая ссылка на APK из GitHub Releases
const APK_URL = "https://github.com/ВАШ_ЛОГИН/РЕПО/releases/download/ТЕГ/ИМЯ_ФАЙЛА.apk";

const IG = (u) => "https://www.instagram.com/" + u;
const T = (u) => "https://t.me/" + u;

const SERVICES = [
  ["🌐", "Создать сайт"], ["⭐️", "Купить Telegram Stars"],
  ["🎁", "Купить NFT Gift"], ["💎", "Купить Telegram Premium"],
];

const ABOUT = {
  sosed: "sosed.uz — шеринг вещей и взаимопомощь рядом с вами!\n\nУдобный сервис в Telegram и на сайте, который объединяет соседей по районам. Делитесь тем, чем не пользуетесь, берите во временное пользование нужные инструменты (бесплатно или за символическую плату) и выручайте друг друга в пару кликов.",
  auction: "auction game — это Telegram-игра «Аукцион», азартная дуэль с друзьями, где вы торгуетесь за случайные лоты, соревнуясь в стратегической выдержке и распределении бюджета!\n\nСобирайте сильнейшие команды по супергероям Marvel/DC или известным футболистам вслепую и узнайте, чей состав окажется мощнее.",
  kylix: "Kylix.uz — это интернет-магазин с большим выбором товаров: одежда, обувь, кепки и многое другое с удобной доставкой.",
};

// action: [иконка, подпись, тип, значение]
const VIEWS = {
  home: { title: "Меню", items: [
    ["🛠", "Услуги", "go", "services"],
    ["🚀", "Мои проекты", "go", "projects"],
    ["📬", "Связаться", "go", "contact"],
  ]},
  services: { title: "Услуги", back: "home", items: SERVICES.map(s => [s[0], s[1], "order", s[1]]) , note: "Раздел в разработке — напишите мне, всё решим лично." },
  projects: { title: "Мои проекты", back: "home", items: [
    ["🏠", "sosed.uz", "go", "sosed"],
    ["🎮", "auction game", "go", "auction"],
    ["👕", "kylix.uz", "go", "kylix"],
  ]},
  sosed: { title: "sosed.uz", back: "projects", items: [
    ["❓", "Что такое sosed.uz?", "go", "about_sosed"],
    ["🌐", "Сайт", "ext", "https://aztrdv.adaf.workers.dev/"],
    ["📥", "Скачать", "ext", APK_URL],
    ["✈️", "Телеграм бот", "tg", "localtasks_bot"],
    ["✈️", "Телеграм канал", "tg", "sosed_uzz"],
    ["📸", "Инстаграм", "ext", IG("sosed_uz")],
  ]},
  auction: { title: "auction game", back: "projects", items: [
    ["❓", "Что такое auction game?", "go", "about_auction"],
    ["🎮", "Играть", "tg", "auction_hub_bot"],
    ["✈️", "Телеграм", "tg", "auctiongame_az"],
    ["📸", "Инстаграм", "ext", IG("auction_game")],
  ]},
  kylix: { title: "kylix.uz", back: "projects", items: [
    ["❓", "Что такое kylix.uz?", "go", "about_kylix"],
    ["✈️", "Телеграм", "tg", "kylixuz"],
    ["📸", "Инстаграм", "ext", IG("kylix.uz")],
  ]},
  about_sosed: { title: "sosed.uz", back: "sosed", text: ABOUT.sosed },
  about_auction: { title: "auction game", back: "auction", text: ABOUT.auction },
  about_kylix: { title: "kylix.uz", back: "kylix", text: ABOUT.kylix },
  contact: { title: "Связаться", back: "home", items: [
    ["📞", "+998 877701799", "ext", "tel:+998877701799"],
    ["✈️", "@azatrdv", "tg", "azatrdv"],
    ["✈️", "@nsvef", "tg", "nsvef"],
    ["📸", "Instagram: azat.trd", "ext", IG("azat.trd")],
  ]},
};

const el = document.getElementById("view");
const esc = (s) => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(name) {
  const v = VIEWS[name];
  let h = name === "home" ? "" : `<h2>${esc(v.title)}</h2>`;
  if (v.text) h += `<p class="text">${esc(v.text)}</p>`;
  if (v.note) h += `<p class="lead">${esc(v.note)}</p>`;
  (v.items || []).forEach(([ico, label, type, val]) => {
    h += `<button class="row" data-type="${type}" data-val="${esc(val)}"><span class="ico">${ico}</span><b>${esc(label)}</b><span class="go">${type === "go" ? "›" : ""}</span></button>`;
  });
  el.innerHTML = h;
  window.scrollTo(0, 0);
  document.getElementById("backBtn").hidden = !v.back;
  if (tg) {
    if (v.back) tg.BackButton.show();
    else tg.BackButton.hide();
  }
  current = name;
}

let current = "home";
function backHandler() { const b = VIEWS[current].back; if (b) render(b); }

const openTg = (u) => (tg && tg.openTelegramLink) ? tg.openTelegramLink(T(u)) : window.open(T(u), "_blank");
const openExt = (u) => (tg && tg.openLink) ? tg.openLink(u) : window.open(u, "_blank");

el.addEventListener("click", (e) => {
  const b = e.target.closest(".row"); if (!b) return;
  const { type, val } = b.dataset;
  if (type === "go") render(val);
  else if (type === "tg") openTg(val);
  else if (type === "ext") openExt(val);
  else if (type === "dl") {
    let u = val;
    try { u = new URL(val, location.href).href; } catch (_) {}
    openExt(u);
  }
  else if (type === "order") openTg("azatrdv?text=" + encodeURIComponent("Здравствуйте! Интересует: " + val));
});

if (tg) tg.BackButton.onClick(backHandler);
document.getElementById("backBtn").addEventListener("click", backHandler);
render("home");
</script>
</body>
</html>
